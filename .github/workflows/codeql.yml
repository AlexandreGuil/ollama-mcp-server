name: CodeQL

# Static analysis for Python source. Runs on every push/PR to main and on a
# weekly schedule to catch advisory updates against unchanged code.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Mondays, 05:30 UTC
    - cron: "30 5 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      # actions/checkout@v4.2.2
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # github/codeql-action/init@v3.32.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@fbcef3fba75224ed6476919775448de80b23cb15
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # github/codeql-action/analyze@v3.32.0
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@fbcef3fba75224ed6476919775448de80b23cb15
        with:
          category: "/language:${{ matrix.language }}"
